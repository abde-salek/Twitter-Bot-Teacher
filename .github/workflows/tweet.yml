name: Daily Tweet Bot

on:
  schedule:
    - cron: '0 12 * * *'  # Runs every day at 12 PM UTC
  workflow_dispatch:      # Allow manual trigger

jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'  # Cache Python dependencies for faster runs

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt  # Assumes you have requirements.txt

      - name: Install system dependencies (Firefox & Geckodriver)
        run: |
          sudo apt-get update
          # Install required libraries for Selenium/Firefox
          sudo apt-get install -y libgtk-3-0 libdbus-glib-1-2 libxt6 wget tar
          # Install Firefox via Snap if not already installed
          if ! command -v firefox &> /dev/null; then
            sudo snap install firefox
          fi
          # Download and install Geckodriver (use a specific version for stability)
          wget -q https://github.com/mozilla/geckodriver/releases/download/v0.34.0/geckodriver-v0.34.0-linux64.tar.gz
          tar -xzf geckodriver-v0.34.0-linux64.tar.gz
          chmod +x geckodriver
          sudo mv geckodriver /usr/local/bin/

      - name: Run Tweet Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CONSUMER_KEY: ${{ secrets.CONSUMER_KEY }}
          CONSUMER_SECRET: ${{ secrets.CONSUMER_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
        run: python main.py || echo "Script failed - check logs"  # Add basic error handling
